[workspace]
resolver = "2"
members = [
    "crates/ssbx",
    "crates/sandbox-core",
    "crates/sandbox-policy",
    "crates/sandbox-proxy",
    "crates/sandbox-mech-podman",
    "crates/sandbox-mech-mac",
    "crates/sandbox-mech-krun",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["simple-tools"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
which = "7"
libc = "0.2"

# Sibling simple-tools crates (public tree → public siblings)
limited-core = { path = "../limited-shell-public/limited-core" }
secure-memory = { path = "../rust-secure-memory-public/crates/secure-memory" }
simple_network = { path = "../simple-network-public", default-features = false }

# Internal crates
sandbox-core = { path = "crates/sandbox-core" }
sandbox-policy = { path = "crates/sandbox-policy" }
sandbox-proxy = { path = "crates/sandbox-proxy" }
sandbox-mech-podman = { path = "crates/sandbox-mech-podman" }
sandbox-mech-mac = { path = "crates/sandbox-mech-mac" }
sandbox-mech-krun = { path = "crates/sandbox-mech-krun" }
